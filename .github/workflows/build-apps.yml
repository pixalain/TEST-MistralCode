name: Build Android & iOS

on:
  push:
    branches: [main, 'vibe/**']
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    # Le build Android (APK) est le livrable principal : on le lance aussi sur les PR
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Installer les dépendances Flutter
        run: flutter pub get

      - name: Analyser le code
        run: flutter analyze --no-pub

      - name: Lancer les tests
        run: flutter test

      - name: Construire l'APK Android (release)
        run: flutter build apk --release

      - name: Publier l'APK en artefact (lien de téléchargement Android)
        uses: actions/upload-artifact@v4
        with:
          name: ferrari-history-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS (build sans signature)
    runs-on: macos-14
    # macOS : ne lancer que sur push pour éviter que la PR n'annule le run en cours
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Installer les dépendances Flutter
        run: flutter pub get

      - name: Analyser le code
        run: flutter analyze --no-pub

      - name: Lancer les tests
        run: flutter test

      - name: Construire l'app iOS (no codesign, pour simulator)
        run: flutter build ios --no-codesign --simulator

      - name: Empaqueter le .app iOS en ZIP
        run: |
          cd build/ios/iphonesimulator
          zip -r ../../../../ferrari-history-ios-simulator.zip Runner.app

      - name: Publier le .app iOS en artefact (lien de téléchargement iOS)
        uses: actions/upload-artifact@v4
        with:
          name: ferrari-history-ios-app
          path: build/ferrari-history-ios-simulator.zip
