name: Build Android & iOS

on:
  push:
    branches: [main, 'vibe/**']
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Installer les dépendances Flutter
        run: flutter pub get

      - name: Analyser le code
        run: flutter analyze --no-pub

      - name: Lancer les tests
        run: flutter test

      - name: Construire l'APK Android (release)
        run: flutter build apk --release

      - name: Publier l'APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: ferrari-history-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Créer la release GitHub avec l'APK (branche main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Ferrari History v${{ github.run_number }} — Android
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          make_latest: true

  ios:
    name: iOS (build sans signature)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Installer les dépendances Flutter
        run: flutter pub get

      - name: Analyser le code
        run: flutter analyze --no-pub

      - name: Lancer les tests
        run: flutter test

      - name: Construire l'app iOS (no codesign, pour simulator)
        run: flutter build ios --no-codesign --simulator

      - name: Empaqueter le .app iOS en ZIP
        run: |
          cd build/ios/iphonesimulator
          zip -r ../../../../ferrari-history-ios-simulator.zip Runner.app

      - name: Publier le .app iOS en artefact
        uses: actions/upload-artifact@v4
        with:
          name: ferrari-history-ios-app
          path: build/ferrari-history-ios-simulator.zip
