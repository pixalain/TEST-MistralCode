name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler l'APK (debug, installable directement)
        run: gradle assembleDebug --no-daemon

      - name: Renommer l'APK
        run: mv app/build/outputs/apk/debug/app-debug.apk SuiviBasicFit.apk

      - name: Publier l'artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: SuiviBasicFit-APK
          path: SuiviBasicFit.apk
